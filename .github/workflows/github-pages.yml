# Zet de website gratis online via GitHub Pages (zonder hostingprovider).
# Draait vanzelf na elke wijziging op GitHub.
# Eenmalig nodig: Settings → Pages → Source: "GitHub Actions".

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.166.0"
    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Pages instellen
        id: pages
        uses: actions/configure-pages@v5

      - name: Hugo installeren
        run: |
          curl -sSL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tgz -C /usr/local/bin hugo
          hugo version

      - name: Website bouwen
        working-directory: site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Website klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Online zetten
        id: deployment
        uses: actions/deploy-pages@v4
